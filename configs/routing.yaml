# M2 routing configuration — cited-wading policy + operational snap gate.
#
# ┌─ PROVENANCE & RATIFICATION STATUS (read before editing any value) ────────┐
# │ basis:            repo internal precedent, no external standard located  │
# │                   (the repo's causal-proximity tolerance of 25 m —       │
# │                   jaladhar/web/drains.py CAUSAL_PROXIMITY_M).            │
# │ provenance_grade: D-internal — graded BELOW the CPHEEO-class cited       │
# │                   figures exactly as width provenance is: an internal    │
# │                   precedent is weaker than an external citation, and     │
# │                   that grade must never be hidden. Not every threshold   │
# │                   can have a published source; the requirement is the    │
# │                   visible grade.                                         │
# │ sensitivity:      [15, 50] m — the gate stays honest anywhere in this    │
# │                   band; 25 m sits mid-band. Moving outside the band      │
# │                   changes snap-refusal behaviour materially.             │
# │ RATIFIED: owner statement 2026-08-26 ratifies the 25 m operational      │
# │                   value WITH its grade stated. Ratification does not     │
# │                   convert internal precedent into an external standard;  │
# │                   any external claim built on 25 m carries grade         │
# │                   D-internal explicitly.                                 │
# └──────────────────────────────────────────────────────────────────────────┘

vehicle_policy_path: "data/curation/vehicle_wading_policy.json"
server_max_snap_distance_m: 25.0
server_max_snap_distance_basis: "repo internal precedent, no external standard located (causal-proximity tolerance, drains.py CAUSAL_PROXIMITY_M); provenance_grade D-internal; RATIFIED 2026-08-26 with grade stated"

# Scientific-gate report binding (audit fix F7, 2026-08-26): binds the realized
# post-exclusion G1 rescore so /health surfaces the TRUE routing blocker —
# scientific_readiness.status=not_accepted with report_path+sha256 — instead of
# a generic "unavailable". This makes the failure MORE visible, never less:
# the G1 rescore is FAIL (104/399 hits, lift ~1.30 under the frozen >=0.60/>=3.0
# thresholds) and routing execution stays refused while it stands.
gate_report_path: "runs/wf3_replay2_gates_v7_excluded/g1_score.json"

# WF8 presentation-day demo: route refusals key on the 3-hour forecast at its
# VALID time (2022-09-04T21:40Z, "03:10 IST" state the audience just watched),
# not frame 0 of the played series (the issue-instant state). The gate report
# above deliberately keeps citing the v6 event-maximum score as backing
# evidence (owner directive 2026-08-27): its recorded depth-product hash will
# not match this file, /health says so honestly, and POST /v1/route still
# returns 503 scientific_gate_not_accepted.
depth_product_override_path: "runs/wf3_uncoupled_3h_forecast_warm_product/products/segment_status.csv"

# WF-7 routing graph connectivity fix (measured 2026-08-27, CPU-only):
# Provenance: endpoint snapping follows WF-1 drain stitcher scheme verbatim
#   (cKDTree.query_pairs(tol) -> union-find clusters -> min(round(x,3),round(y,3)) rep;
#   see src/jaladhar/drainage/stitch.py _snap_slots / loader.py _snapped_representatives).
# Measured sweep on realized roads_centrelines.gpkg (176171 segments, 177077 parts):
#   0.0m (legacy exact): 107014 comps, 279627 nodes
#   0.5m: 107005 comps (-9), 279611 nodes
#   1.0m: 106921 comps (-93), 279471 nodes
#   2.0m: 106569 comps (-445, -0.42%), 279012 nodes  <- CHOSEN (upper prior 1-2m, conservative)
#   5.0m: 102849 comps (-4165), 274141 nodes
#   10.0m: 92223 comps (-14791), 257176 nodes
# Rationale: gain accelerates beyond 2m but risks false merges of parallel service roads /
# dual carriageways (typical 5-7m separation). Prior 1-2m balances digitization-gap closure
# (101k pairs at 0.5m yield only 16 node merges) vs over-merge. Chosen 2.0m is measurably
# better than 1.0m while remaining conservative. Intersection splitting measured via STRtree
# (~18k interior crossings extrapolated) but SKIPPED: planar split would falsely connect
# grade-separated bridges/tunnels without verified z-level.
routing_graph:
  endpoint_snap_tolerance_m: 2.0
  enable_intersection_splitting: false
